<!DOCTYPE html>
<html lang="zh-Hant" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate"> 
<title>Elden Ring Nightreign Map Seed</title>
<style>
/* =========================================
   全域設定 & 變數
   ========================================= */
:root {
    --bg-color: #0f0f0f;
    --panel-bg: #141414;
    --border-color: rgba(255, 255, 255, 0.1);
    --text-main: #e0e0e0;
    --text-sub: #666;
    --accent-glow: rgba(255, 255, 255, 0.25);
    --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
}

* { box-sizing: border-box; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-stack);
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 14px; 
}

/* =========================================
   強制橫屏提示層 (預設隱藏)
   ========================================= */
#orientation-lock {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: #1a1a1a;
    z-index: 99999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#orientation-lock img {
    width: 66%;
    max-width: 500px;
    height: auto;
    object-fit: contain;
}

/* =========================================
   佈局容器
   ========================================= */
#app-container {
    display: grid;
    /* [電腦版] 穩定的三欄佈局 */
    grid-template-columns: 290px 1fr 180px;
    width: 100%;
    height: 100%;
    max-width: 1920px;
    gap: 0;
    transition: opacity 0.3s;
}

/* 手機版按鈕預設隱藏 */
#mobile-menu-trigger { display: none; }
.mobile-close-btn { display: none; }

/* =========================================
   通用：流光邊框卡片
   ========================================= */
.glow-box {
    position: relative;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    transition: background 0.3s;
}
.glow-box::before {
    content: "";
    position: absolute;
    top: -1px; left: -1px; right: -1px; bottom: -1px;
    background: radial-gradient(300px circle at var(--x) var(--y), var(--accent-glow), transparent 40%);
    z-index: -1;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    border-radius: inherit;
}
.glow-box::after {
    content: "";
    position: absolute;
    top: -1px; left: -1px; right: -1px; bottom: -1px;
    background: var(--panel-bg);
    z-index: -1;
    border-radius: inherit;
    margin: 1px;
}
.glow-box:hover::before { opacity: 1; }

/* =========================================
   左側面板
   ========================================= */
#left-panel {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border-right: 1px solid var(--border-color);
    overflow-y: auto;
    z-index: 10;
    background: var(--bg-color);
}
#left-panel::-webkit-scrollbar { width: 4px; }
#left-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

.quick-filters-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.drawer-content {
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 10px;
}

.logo-area { 
    font-size: 16px; 
    font-weight: bold; 
    letter-spacing: 2px; 
    color: #fff; 
    opacity: 0.8; 
    margin-bottom: 5px; 
}
/* 預設桌面版顯示，手機版會在下方 media query 隱藏 */
.logo-desktop { display: block; }
.logo-mobile { display: none; margin-top: 10px; }

.info-group { padding: 12px; border-radius: 4px; }
.info-title {
    font-size: 10px; font-weight: 700; color: var(--text-sub); letter-spacing: 1px;
    margin-bottom: 6px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px;
}

.info-content p { 
    margin: 4px 0; font-size: 13px; display: flex; justify-content: space-between; align-items: flex-start;
}
.info-content strong { color: var(--text-sub); font-weight: normal; margin-right: 15px; white-space: nowrap; flex-shrink: 0; }
.info-content span { text-align: right; word-break: break-word; line-height: 1.4; }

.boss-list { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 8px; }
.boss-item {
    display: flex; align-items: center; padding: 6px; cursor: pointer; border-radius: 4px;
    transition: background 0.2s; position: relative;
}
.boss-item:hover { background: rgba(255,255,255,0.03); }
.boss-item.selected { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }

.boss-icon-frame { width: 32px; height: 32px; overflow: hidden; margin-right: 10px; border: 1px solid #333; border-radius: 4px; }
.boss-icon-frame img { width: 100%; height: 100%; object-fit: cover; }
.boss-info { display: flex; flex-direction: column; justify-content: center; }
.boss-alias { font-size: 12px; color: #ddd; font-weight: 500; }
.boss-realname { font-size: 10px; color: #666; margin-top: 1px; }

.action-bar { display: flex; gap: 8px; margin-top: auto; padding-bottom: 20px;}
.btn-minimal {
    flex: 1; padding: 10px; background: transparent; color: #888;
    border: 1px solid var(--border-color); font-size: 12px; cursor: pointer;
    transition: all 0.2s; border-radius: 4px; text-align: center;
}
.btn-minimal:hover { color: #fff; border-color: #555; background: rgba(255,255,255,0.02); }

/* =========================================
   中間面板：地圖區
   ========================================= */
#center-panel {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #1a1a1a 0%, #0f0f0f 70%);
    overflow: hidden;
    z-index: 1;
}

#mapWrapper {
    position: relative;
    width: 400px;
    height: 400px;
    transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    /* [電腦版] 保持原始縮放比例 1.45 */
    transform: scale(1.45);
}

#大地圖 {
    width: 100%; height: 100%; display: block;
    filter: grayscale(20%) contrast(110%);
    transition: opacity 0.4s ease, filter 0.4s ease;
}
#大地圖.fade-out { opacity: 0; filter: blur(10px); transform: scale(0.95); }

.icon {
    position: absolute; width: 30px; height: 30px;
    cursor: pointer; z-index: 20;
    transition: filter 0.2s;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    transform-origin: bottom center;
    display: none; 
}
.icon:hover { filter: brightness(1.3) drop-shadow(0 0 5px rgba(255,255,255,0.4)); z-index: 30; }

.icon.pop-effect {
    animation: chess-impact 0.6s forwards !important; 
    filter: brightness(1.1); 
    z-index: 50;
    display: block !important; 
}

@keyframes chess-impact {
  0% { opacity: 0; transform: translateY(-60px) scale(1); animation-timing-function: ease-in; }
  40% { opacity: 1; transform: translateY(0) scale(1); }
  50% { transform: translateY(2px) scale(1.3, 0.7); animation-timing-function: ease-out; }
  65% { transform: translateY(-4px) scale(0.9, 1.1); }
  80% { transform: translateY(0) scale(1.05, 0.95); }
  100% { transform: translateY(0) scale(1); }
}

#status-toast {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    padding: 8px 20px; 
    background: rgba(20, 20, 20, 0.6); 
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #ccc; font-size: 12px; border-radius: 30px; pointer-events: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    text-align: center;
    white-space: nowrap;
    z-index: 80;
}

/* =========================================
   垂直側邊觸控工具列
   ========================================= */
#touch-toolbar {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%) translateX(-60px); 
    display: flex;
    flex-direction: column;
    width: 44px; 
    background: rgba(30, 30, 30, 0.4); 
    border: 1px solid rgba(255, 255, 255, 0.08); 
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 22px;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

#touch-toolbar.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-50%) translateX(0);
}

.tool-btn {
    width: 100%;
    height: 52px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    background: transparent;
    transition: background 0.2s, opacity 0.2s;
    touch-action: none; 
    -webkit-tap-highlight-color: transparent;
}
.tool-btn:first-child { border-radius: 22px 22px 0 0; }
.tool-btn:last-child { border-radius: 0 0 22px 22px; }
.tool-btn:not(:last-child)::after {
    content: ""; position: absolute; bottom: 0; left: 10px; right: 10px; 
    height: 1px; background: rgba(255, 255, 255, 0.05);
}
.tool-btn img { width: 24px; height: 24px; object-fit: contain; pointer-events: none; opacity: 0.4; transition: opacity 0.3s; }
.tool-btn span { font-size: 20px; color: #fff; font-weight: 300; pointer-events: none; opacity: 0.4; transition: opacity 0.3s; }
.tool-btn.active { background: rgba(255, 255, 255, 0.1); }
.tool-btn.active img { opacity: 1; }
.tool-btn.active span { opacity: 1; }

.drag-ghost {
    position: fixed; width: 40px; height: 40px;
    pointer-events: none; z-index: 9999;
    opacity: 1;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    transform: translate(-50%, -50%) scale(1.1);
}

/* =========================================
   右側面板：3D 滾輪
   ========================================= */
#right-panel {
    position: relative;
    border-left: 1px solid var(--border-color);
    background: linear-gradient(to right, #0f0f0f, #141414);
    overflow: hidden;
    cursor: grab;
    perspective: 1000px;
    z-index: 10;
}
#right-panel:active { cursor: grabbing; }

.wheel-list {
    position: absolute; top: 50%; left: 0; width: 100%;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
}
/* 當手指放開需要回彈時，透過 JS 加回這個 class */
.wheel-list.snapping {
    transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.terrain-item {
    height: 52px; padding: 12px 10px 12px 25px;
    cursor: pointer; color: #555; font-size: 13px; font-weight: 500;
    transition: transform 0.3s ease, color 0.3s ease, opacity 0.3s ease; 
    transform-origin: left center;
    border-left: 2px solid transparent; position: relative; opacity: 0.6;
    display: flex; align-items: center;
}
.terrain-item:not(.active) { transform: scale(0.9) translateX(0px); }
.terrain-item.active {
    color: #fff; font-size: 16px; opacity: 1;
    border-left: 2px solid #fff;
    transform: scale(1.1) translateX(20px);
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
}
.terrain-item:hover:not(.active) { color: #aaa; transform: scale(1) translateX(10px); }

/* UI 控制按鈕 */
#settings-trigger, #help-trigger {
    position: absolute; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid #444; background: #1a1a1a; color: #888;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 100; transition: transform 0.3s, color 0.3s;
    font-size: 14px;
}
#settings-trigger { bottom: 20px; left: 20px; }
#settings-trigger:hover { color: #fff; border-color: #666; transform: rotate(90deg); }
#help-trigger { top: 20px; right: 20px; font-weight: bold; font-family: monospace; }
#help-trigger:hover { color: #fff; border-color: #666; transform: scale(1.1); }

/* Modals */
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 2000; display: none;
    backdrop-filter: blur(5px);
}
.modal-box {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 380px; max-width: 90%; background: #1a1a1a; border: 1px solid #333;
    padding: 25px; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; gap: 12px;
}
.modal-title { font-size: 15px; color: #fff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
.setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.setting-btn {
    background: #222; border: 1px solid #444; color: #ccc; padding: 5px 10px;
    cursor: pointer; font-size: 12px; margin-left: 5px; border-radius: 3px;
}
.setting-btn.active { background: #ccc; color: #000; border-color: #fff; }
.content-text { 
    font-size: 13px; 
    line-height: 1.6; 
    color: #ccc; 
    white-space: pre-wrap; 
    margin: 8px 0; 
    /* [保留] 上下細線分隔 */
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 0;
}
.modal-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; font-size: 12px; color: #666; }
.modal-btn-primary {
    background: #ccc; color: #000; border: none; padding: 6px 14px; border-radius: 4px;
    cursor: pointer; font-weight: bold; transition: opacity 0.2s; font-size: 12px;
}
.modal-btn-primary:hover { opacity: 0.8; }
.text-btn { cursor: pointer; color: #888; text-decoration: underline; display: block; text-align: right; }
.text-btn:hover { color: #fff; }
input[type="checkbox"] { accent-color: #666; vertical-align: middle; }


/* =========================================
   直向鎖定 (Portrait Lock)
   ========================================= */
@media screen and (max-width: 900px) and (orientation: portrait) {
    #app-container {
        display: none !important; 
    }
    #orientation-lock {
        display: flex !important; 
    }
}

/* =========================================
   手機版 (橫向) 優化
   ========================================= */
@media screen and (max-width: 900px) and (orientation: landscape) {
    
    #app-container {
        display: block;
        position: relative;
    }

    .logo-desktop { display: none; }
    .logo-mobile { display: block; }

    /* 左側選單結構重組 */
    #left-panel {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: transparent;
        border: none;
        padding: 0;
        pointer-events: none; 
        z-index: 2000;
        overflow: visible;
    }

    /* 懸浮快捷區 */
    .quick-filters-group {
        position: fixed;
        top: 10px;
        left: 10px;
        pointer-events: auto; 
        background: rgba(20, 20, 20, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        gap: 6px;
        width: auto;
        max-width: 220px; 
        z-index: 2100;
    }
    
    .quick-filters-group .info-title { font-size: 9px; margin-bottom: 2px; }
    .quick-filters-group .info-content p { font-size: 11px; margin: 2px 0; justify-content: flex-start; gap: 10px; }
    .quick-filters-group .info-group { padding: 4px 8px; border: none; background: transparent; }
    .quick-filters-group .info-group.glow-box { border: none; background: transparent; }
    .quick-filters-group .glow-box::before, 
    .quick-filters-group .glow-box::after { display: none; }
    .quick-filters-group .info-content strong { margin-right: 0; width: 45px; }

    /* 抽屜式選單 */
    .drawer-content {
        position: fixed;
        top: 0;
        left: -100%; 
        width: 60%;  
        height: 100%;
        background: var(--panel-bg);
        z-index: 2200;
        /* 加入 transform 的過渡，讓 JS 控制的 swiping 更順暢 */
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: auto;
        padding: 20px;
        border-right: 1px solid var(--border-color);
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        
        /* 預設位置使用 transform 移動，而非 left */
        left: 0;
        transform: translateX(-100%);
    }
    .drawer-content.open { 
        transform: translateX(0); 
    }

    .mobile-close-btn { display: none !important; }

    /* 展開選單按鈕 */
    #mobile-menu-trigger {
        display: block;
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 1001;
        padding: 8px 16px;
        background: var(--bg-color);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        font-weight: bold;
        pointer-events: auto;
        font-size: 12px;
    }

    /* 右側地形選擇區 */
    #right-panel {
        position: fixed;
        top: 0;
        right: 0;
        width: 180px; 
        height: 100%;
        z-index: 1900;
        background: linear-gradient(to right, transparent, rgba(0,0,0,0.8));
        border-left: none;
    }

    /* 中間地圖區 */
    #center-panel {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0; 
    }

    #mapWrapper {
        transform: scale(0.95);
    }
    
    #touch-toolbar {
        top: 10px;            
        left: 120px;
        bottom: auto;         
        transform: none;      
        opacity: 0;           
        pointer-events: none;
        z-index: 2150;        
    }
    
    #touch-toolbar.visible {
        opacity: 1;
        pointer-events: auto;
        transform: none;
    }
    
    #settings-trigger { bottom: 60px; left: 20px; width: 32px; height: 32px; }
    #help-trigger { top: auto; bottom: 60px; right: 170px; width: 32px; height: 32px; }
}

</style>
</head>
<body>

<div id="orientation-lock">
    <img src="橫向提示.png" alt="請旋轉手機">
</div>

<div id="app-container">
    
    <button id="mobile-menu-trigger">☰ MENU</button>

    <div id="left-panel">
        
        <div class="logo-area logo-desktop">NIGHTREIGN</div>

        <div class="quick-filters-group">
            <div class="info-group glow-box">
                <div class="info-title" data-zh="城堡" data-en="CASTLE">城堡</div> 
                <div class="info-content">
                    <p><strong data-key="地下">地下</strong><span id="val-地下">-</span></p>
                    <p><strong data-key="主要">主要</strong><span id="val-主要">-</span></p>
                    <p><strong data-key="樓頂">樓頂</strong><span id="val-樓頂">-</span></p>
                </div>
            </div>

            <div class="info-group glow-box">
                <div class="info-title" data-zh="夜晚" data-en="NIGHT">夜晚</div> 
                <div class="info-content">
                    <p><strong data-key="第一夜">第一夜</strong><span id="val-第一夜">-</span></p>
                    <p><strong data-key="第二夜">第二夜</strong><span id="val-第二夜">-</span></p>
                </div>
            </div>

            <div class="info-group glow-box">
                <div class="info-title" data-zh="特殊" data-en="EVENT">特殊</div> 
                <div class="info-content">
                    <p><strong data-key="第一天">第一天</strong><span id="val-第一天">-</span></p>
                    <p><strong data-key="第二天">第二天</strong><span id="val-第二天">-</span></p>
                </div>
            </div>
        </div>

        <div class="drawer-content" id="drawer">
            <div class="logo-area logo-mobile">NIGHTREIGN</div>

            <div class="info-title" style="margin-top:20px;" data-zh="目標王" data-en="TARGET LORDS">目標王</div>
            <div class="boss-list" id="bossListContainer"></div>

            <div class="action-bar">
                <button class="btn-minimal glow-box" id="clearBtn" data-zh="清除地圖" data-en="CLEAR MAP">清除地圖</button>
                <button class="btn-minimal glow-box" id="resetBtn" data-zh="重置全部" data-en="RESET ALL">重置全部</button>
            </div>
        </div>
    </div>

    <div id="center-panel">
        <div id="mapWrapper">
            <img src="普通地形.png" id="大地圖" alt="Map">
        </div>
        
        <div id="status-toast">請選擇地形，放置圖標</div>

        <div id="touch-toolbar">
            <div class="tool-btn active" id="tool-church" data-type="教堂">
                <img src="教堂圖標.png" alt="Church">
            </div>
            <div class="tool-btn" id="tool-tower" data-type="法師塔">
                <img src="法師塔圖標.png" alt="Tower">
            </div>
            <div class="tool-btn" id="tool-eraser" data-type="eraser">
                <span>×</span>
            </div>
        </div>

        <div id="settings-trigger">⚙</div>
        <div id="help-trigger">?</div>
    </div>

    <div id="right-panel">
        <div class="wheel-list" id="terrainWheel"></div>
    </div>
</div>

<div class="modal-overlay" id="settingModal">
    <div class="modal-box glow-box">
        <div class="modal-title">SETTINGS</div>
        <div class="setting-row">
            <span>LANGUAGE</span>

/* =========================================
   滾輪初始化 (包含點擊 vs 拖曳優化)
   ========================================= */
function initWheel() {
    const container = document.getElementById('right-panel');
    const list = document.getElementById('terrainWheel');
    let isLocked = false;
    const itemHeight = 52; 

    list.innerHTML = '';
    TERRAINS.forEach((t, idx) => {
        const div = document.createElement('div');
        div.className = `terrain-item`;
        div.dataset.id = t.id;
        div.textContent = state.lang === 'en' ? t.en : t.name;
        
        div.onclick = (e) => {
            e.stopPropagation();
            if (container.dataset.isDragging === 'true') return;
            if (state.terrainIndex !== idx) snapTo(idx);
        };
        list.appendChild(div);
    });

    const snapTo = (idx) => {
        if (idx < 0) idx = 0;
        if (idx >= TERRAINS.length) idx = TERRAINS.length - 1;
        state.terrainIndex = idx;
        
        const offset = - (state.terrainIndex * itemHeight) - (itemHeight / 2);
        
        list.classList.add('snapping');
        list.style.transform = `translateY(${offset}px)`;

        const items = list.querySelectorAll('.terrain-item');
        items.forEach((item, i) => item.classList.toggle('active', i === state.terrainIndex));

        switchTerrain(TERRAINS[state.terrainIndex].id);
        
        setTimeout(() => {
            list.classList.remove('snapping');
        }, 300);
    };

    // 1. 電腦版滑鼠滾輪
    container.onwheel = (e) => {
        e.preventDefault();
        if (isLocked) return; 

        isLocked = true;
        const direction = e.deltaY > 0 ? 1 : -1;
        const nextIdx = state.terrainIndex + direction;

        if (nextIdx >= 0 && nextIdx < TERRAINS.length) {
            snapTo(nextIdx);
        }

        setTimeout(() => { isLocked = false; }, 150); 
    };

    // 2. 手機版觸控拖曳
    let startY = 0;
    let currentY = 0;
    let isTouching = false;
    let initialOffset = 0;
    let totalDeltaY = 0;

    container.addEventListener('touchstart', (e) => {
        isTouching = true;
        startY = e.touches[0].clientY;
        initialOffset = - (state.terrainIndex * itemHeight) - (itemHeight / 2);
        totalDeltaY = 0;
        list.classList.remove('snapping');
        
        container.dataset.isDragging = 'false';
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
        if (!isTouching) return;
        e.preventDefault(); 
        
        const currentTouchY = e.touches[0].clientY;
        const deltaY = currentTouchY - startY;
        totalDeltaY = deltaY;
        
        if (Math.abs(deltaY) > 5) {
            container.dataset.isDragging = 'true';
            
            const resistance = 0.6; 
            currentY = initialOffset + (deltaY * resistance);
            list.style.transform = `translateY(${currentY}px)`;

            let liveIndex = Math.round((-currentY - (itemHeight/2)) / itemHeight);
            if (liveIndex < 0) liveIndex = 0;
            if (liveIndex >= TERRAINS.length) liveIndex = TERRAINS.length - 1;

            const items = list.querySelectorAll('.terrain-item');
            items.forEach((item, i) => item.classList.toggle('active', i === liveIndex));
        }

    }, { passive: false });

    container.addEventListener('touchend', (e) => {
        if (!isTouching) return;
        isTouching = false;
        
        if (container.dataset.isDragging === 'true') {
            let estimatedIdx = Math.round((-currentY - (itemHeight/2)) / itemHeight);
            snapTo(estimatedIdx);
        }
        
        setTimeout(() => {
             container.dataset.isDragging = 'false';
        }, 50);
    });

    snapTo(state.terrainIndex);
}

function initGlowEffect() {
    document.addEventListener('mousemove', e => {
        document.querySelectorAll('.glow-box').forEach(el => {
            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            el.style.setProperty('--x', `${x}px`);
            el.style.setProperty('--y', `${y}px`);
        });
    });
}

function renderBossList() {
    const container = document.getElementById('bossListContainer');
    container.innerHTML = '';
    
    BOSS_DATA.forEach(boss => {
        const div = document.createElement('div');
        div.className = `boss-item glow-box ${state.selectedBosses.includes(boss.id) ? 'selected' : ''}`;
        div.onclick = (e) => toggleBoss(boss.id, e);
        
        const isEn = state.lang === 'en';
        
        div.innerHTML = `
            <div class="boss-icon-frame"><img src="${boss.icon}" alt="${boss.alias}"></div>
            <div class="boss-info">
                <div class="boss-alias">${isEn ? boss.enAlias : boss.alias}</div>
                <div class="boss-realname">${isEn ? boss.enName : boss.name}</div>
            </div>
        `;
        container.appendChild(div);
    });
}

function renderMapIcons() {
    const wrapper = document.getElementById('mapWrapper');
    const oldIcons = wrapper.querySelectorAll('.icon');
    oldIcons.forEach(i => i.remove());

    const positions = COORDINATE_DB[state.terrain] || [];

    positions.forEach((pos, idx) => {
        const i = idx + 1;
        const img = document.createElement('img');
        img.className = 'icon';
        img.style.top = pos.top + 'px';
        img.style.left = pos.left + 'px';
        img.dataset.idx = i;
        
        const status = state.icons[state.terrain][i];

        if (status === '教堂') img.src = '教堂圖標.png';
        else if (status === '法師塔') img.src = '法師塔圖標.png';
        else img.src = '圖標位置.png';

        img.onmousedown = (e) => handleIconClick(i, e);
        img.oncontextmenu = (e) => e.preventDefault();

        wrapper.appendChild(img);
    });
}

/* =========================================
   核心邏輯 (選擇 Boss & 地形)
   ========================================= */

function toggleBoss(id, e) {
    if (e) e.stopPropagation();

    const isTouch = state.mode === 'touch';
    
    if (!isTouch && e && e.ctrlKey && e.shiftKey) {
        if (state.selectedBosses.length === BOSS_DATA.length) {
            state.selectedBosses = [];
        } else {
            state.selectedBosses = BOSS_DATA.map(b => b.id);
        }
    } else if (isTouch || (e && e.ctrlKey)) {
        if (state.selectedBosses.includes(id)) {
            state.selectedBosses = state.selectedBosses.filter(b => b !== id);
        } else {
            state.selectedBosses.push(id);
        }
    } else {
        if (state.selectedBosses.length === 1 && state.selectedBosses[0] === id) {
            state.selectedBosses = [];
        } else {
            state.selectedBosses = [id];
        }
    }
    renderBossList();
    runFilter();
}

function switchTerrain(id) {
    if (state.terrain === id) return;

    const mapImg = document.getElementById('大地圖');
    const wrapper = document.getElementById('mapWrapper');
    
    const currentIcons = wrapper.querySelectorAll('.icon');
    currentIcons.forEach(i => i.style.display = 'none');

    mapImg.classList.add('fade-out');
    
    setTimeout(() => {
        state.terrain = id;
        mapImg.src = id + ".png";
        
        renderMapIcons(); 
        runFilter(true);
        
        mapImg.onload = () => {
            mapImg.classList.remove('fade-out');
            
            const toast = document.getElementById('status-toast');
            const isUnique = toast.textContent.includes("唯一") || toast.textContent.includes("Unique");
            
            if (!isUnique) {
                const newIcons = wrapper.querySelectorAll('.icon');
                newIcons.forEach(icon => {
                    icon.style.display = 'block';
                    icon.classList.remove('pop-effect'); 
                    icon.style.animationDelay = '';
                });
            }
            mapImg.onload = null;
        };
    }, 300);

}

/* =========================================
   圖標操作邏輯
   ========================================= */
function handleIconClick(idx, e) {
    e.preventDefault();
    e.stopPropagation();

    let img = e.currentTarget; 
    if (!img) img = document.querySelector(`#mapWrapper .icon[data-idx="${idx}"]`);
    
    const current = state.icons[state.terrain][idx];
    let next = null;

    if (state.mode === 'mouse') {
        if (e.button === 0) next = '教堂';
        else if (e.button === 2) next = '法師塔';
    } else {
        if (state.touchTool === null) {
            next = null; 
        } else {
            if (current === state.touchTool) next = null; 
            else next = state.touchTool;
        }
    }

    state.icons[state.terrain][idx] = next;
    updateIconVisual(img, next);
}

function updateIconVisual(img, type) {
    if (!img) return;
    
    if (type === '教堂') img.src = '教堂圖標.png';
    else if (type === '法師塔') img.src = '法師塔圖標.png';
    else img.src = '圖標位置.png';
    
    img.classList.remove('pop-effect');
    
    runFilter();

    if (type) {
        setTimeout(() => {
            void img.offsetWidth; 
            img.classList.add('pop-effect');
        }, 10);
    }
}

/* =========================================
   TOUCH 工具列 & 拖曳邏輯
   ========================================= */
function initTouchDrag() {
    const tools = document.querySelectorAll('.tool-btn');
    
    tools.forEach(btn => {
        let timer = null;
        let isDragMode = false;
        let ghost = null;
        let startX = 0;
        let startY = 0;
        const type = btn.dataset.type === 'eraser' ? null : btn.dataset.type;

        btn.onclick = (e) => {
            if (btn.dataset.justDragged === 'true') {
                delete btn.dataset.justDragged;
                return;
            }
            setTouchTool(type);
        };

        const start = (e) => {
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            isDragMode = false;
            
            timer = setTimeout(() => {
                isDragMode = true;
                if (navigator.vibrate) navigator.vibrate(50);
                
                ghost = document.createElement('img');
                ghost.src = type === '教堂' ? '教堂圖標.png' : (type === '法師塔' ? '法師塔圖標.png' : '圖標位置.png');
                ghost.className = 'drag-ghost';
                if(type === null) ghost.style.opacity = '0.5';
                
                ghost.style.left = touch.clientX + 'px';
                ghost.style.top = touch.clientY + 'px';
                
                document.body.appendChild(ghost);
            }, 300);
        };

        const move = (e) => {
            const touch = e.touches[0];
            
            if (!isDragMode) {
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                if (Math.hypot(dx, dy) > 20) {
                    clearTimeout(timer);
                }
                return;
            }
            
            if(e.cancelable) e.preventDefault(); 
            
            if (ghost) {
                ghost.style.left = touch.clientX + 'px';
                ghost.style.top = touch.clientY + 'px';
            }
        };

        const end = (e) => {
            clearTimeout(timer);
            
            if (isDragMode) {
                btn.dataset.justDragged = 'true';
                
                if (ghost) {
                    const dropX = parseInt(ghost.style.left);
                    const dropY = parseInt(ghost.style.top);
                    ghost.remove();
                    ghost = null;
                    findAndSetNearestIcon(dropX, dropY, type);
                }
                
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
            }
            isDragMode = false;
        };

        btn.addEventListener('touchstart', start, { passive: true });
        btn.addEventListener('touchmove', move, { passive: false });
        btn.addEventListener('touchend', end);
    });
}

function findAndSetNearestIcon(x, y, type) {
    const icons = document.querySelectorAll('#mapWrapper .icon');
    let minDist = 60;
    let target = null;
    let targetIdx = -1;

    icons.forEach(icon => {
        if (getComputedStyle(icon).display === 'none') return;
        
        const rect = icon.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dist = Math.hypot(x - cx, y - cy);

        if (dist < minDist) {
            minDist = dist;
            target = icon;
            targetIdx = parseInt(icon.dataset.idx);
        }
    });

    if (target && targetIdx !== -1) {
        state.icons[state.terrain][targetIdx] = type;
        updateIconVisual(target, type);
    }
}

function setTouchTool(tool) {
    state.touchTool = tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    if (tool === '教堂') document.getElementById('tool-church').classList.add('active');
    else if (tool === '法師塔') document.getElementById('tool-tower').classList.add('active');
    else document.getElementById('tool-eraser').classList.add('active');
}

/* =========================================
   篩選邏輯
   ========================================= */
function runFilter(silentMode = false) {
    const mapEl = document.getElementById('大地圖');
    const toast = document.getElementById('status-toast');
    const wrapper = document.getElementById('mapWrapper');
    const toolbar = document.getElementById('touch-toolbar');
    const isEn = state.lang === 'en';
    const defaultMap = state.terrain + '.png';

    document.oncontextmenu = (e) => e.preventDefault();
    mapEl.style.pointerEvents = 'none';

    if (state.selectedBosses.length === 0) {
        toast.textContent = isEn ? zhToEn["請選擇目標王"] : "請選擇目標王";
        resetDataDisplay();
        mapEl.src = defaultMap;
        if (!silentMode) {
            wrapper.querySelectorAll('.icon').forEach(i => {
                i.style.removeProperty('display'); 
                i.style.display = 'block';
            });
        }
        if (state.mode === 'touch') toolbar.classList.add('visible');
        return;
    }

    if (typeof IMAGES === 'undefined') {
        toast.textContent = isEn ? zhToEn["資料庫未載入"] : "資料庫未載入";
        return;
    }

    toast.textContent = isEn ? zhToEn["篩選中..."] : "篩選中...";

    const nightRanges = terrainNightRanges[state.terrain];
    const nightsToCheck = state.selectedBosses;
    
    let filteredResults = [];

    for (const night of nightsToCheck) {
        const range = nightRanges[night];
        if (!range || (range[0] === 0 && range[1] === 0)) continue;

        let candidates = IMAGES.filter(img => {
            const num = parseInt(img.file, 10);
            return num >= range[0] && num <= range[1];
        });

        candidates = candidates.filter(img => {
            for (let i = 1; i < state.icons[state.terrain].length; i++) {
                const need = state.icons[state.terrain][i];
                if (!need) continue; 

                const actual = img.points[i - 1] || '無';
                
                if (need === '無') {
                    if (actual !== '無') return false;
                } else {
                    if (need !== actual) return false;
                }
            }
            return true;
        });

        if (candidates.length > 0) {
            candidates.forEach(c => (c._night = night));
            filteredResults.push(...candidates);
        }
    }

    const uniqueFiltered = Array.from(new Set(filteredResults.map(img => img.file)))
        .map(f => filteredResults.find(img => img.file === f));

    const handleResult = () => {
        if (uniqueFiltered.length === 0) {
            mapEl.src = defaultMap;
            toast.textContent = isEn ? zhToEn["篩選失敗 — 沒有符合的種子。"] : "篩選失敗 — 沒有符合的種子。";
            resetDataDisplay();
            wrapper.querySelectorAll('.icon').forEach(i => {
                i.style.removeProperty('display');
                i.style.display = 'block';
            });
            if (state.mode === 'touch') toolbar.classList.add('visible');
        } 
        else if (uniqueFiltered.length === 1) {
            const result = uniqueFiltered[0];
            mapEl.src = result.file;
            updateDataDisplay(result);
            
            const bossName = isEn 
                ? BOSS_DATA.find(b => b.id === result._night)?.enAlias 
                : result._night;
                
            toast.textContent = isEn 
                ? `${zhToEn["找到唯一符合種子"]}: ${result.file} | ${bossName}`
                : `找到唯一符合種子：${result.file} | ${bossName}`;
            
            document.oncontextmenu = (e) => {
                if (e.target.id === '大地圖') return true;
                e.preventDefault();
            };
            mapEl.style.pointerEvents = 'auto';
            
            wrapper.querySelectorAll('.icon').forEach(i => {
                i.classList.remove('pop-effect');
                i.style.setProperty('display', 'none', 'important'); 
            });
            
            toolbar.classList.remove('visible');

        } else {
            mapEl.src = defaultMap;
            resetDataDisplay();
            const count = uniqueFiltered.length;
            const remainingTxt = isEn ? zhToEn["還剩"] : "還剩";
            const suffix = isEn ? zhToEn["張（繼續設定圖標可進一步篩選）"] : "張（繼續設定圖標可進一步篩選）";
            toast.textContent = `${remainingTxt} ${count} ${suffix}`;
            wrapper.querySelectorAll('.icon').forEach(i => {
                i.style.removeProperty('display'); 
                i.style.display = 'block';
            });
             if (state.mode === 'touch') toolbar.classList.add('visible');
        }
    };

    if (!silentMode) setTimeout(handleResult, 100);
    else handleResult();
}
function updateDataDisplay(imgData) {
    if (!imgData) return;
    const isEn = state.lang === 'en';
    
    if (typeof imageTexts !== 'undefined' && imageTexts[imgData.file]) {
        const data = imageTexts[imgData.file];
        const fields = ["地下", "主要", "樓頂", "第一夜", "第二夜", "第一天", "第二天"];
        
        fields.forEach(key => {
            const el = document.getElementById(`val-${key}`);
            if (el) {
                let val = data[key];
                if (isEn && zhToEn[val]) val = zhToEn[val];
                el.textContent = val;
            }
        });
    }
}

function resetDataDisplay() {
    document.querySelectorAll('[id^="val-"]').forEach(el => el.textContent = "-");
}

/* =========================================
   設定與模式切換
   ========================================= */
function setLang(l) {
    state.lang = l;
    localStorage.setItem('lang', l);
    document.getElementById('lang-zh').classList.toggle('active', l==='zh');
    document.getElementById('lang-en').classList.toggle('active', l==='en');
    
    document.querySelectorAll('[data-zh]').forEach(el => {
        el.textContent = l === 'en' ? el.dataset.en : el.dataset.zh;
    });

    document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.dataset.key;
        el.textContent = l === 'en' ? (zhToEn[key] || key) : key;
    });

    // 如果是中文，隱藏 Welcome 裡的切換按鈕
    const zhBtn = document.getElementById('welcome-switch-zh');
    if (zhBtn) {
        zhBtn.style.display = (l === 'zh') ? 'none' : 'block';
    }

    renderBossList();
    const list = document.getElementById('terrainWheel');
    list.innerHTML = ''; 
    initWheel(); 
    
    if(window.updateHelpContent) window.updateHelpContent();

    runFilter();
}

function setMode(m) {
    state.mode = m;
    localStorage.setItem('mode', m);

    document.getElementById('mode-mouse').classList.toggle('active', m==='mouse');
    document.getElementById('mode-touch').classList.toggle('active', m==='touch');
    
    const toolbar = document.getElementById('touch-toolbar');
    if (m === 'touch') {
        const mapWrapper = document.getElementById('mapWrapper');
        const isFinished = mapWrapper.querySelectorAll('.icon[style*="important"]').length > 0;
        
        if (!isFinished) toolbar.classList.add('visible');
    } else {
        toolbar.classList.remove('visible');
    }
    
    if(window.updateHelpContent) window.updateHelpContent();

    runFilter();
}

// [新增] 處理帶有自定義彈窗的模式切換邏輯
let pendingMode = null; // 暫存目標模式

function handleModeChangeAttempt(targetMode) {
    const isTouchDev = isTouchDevice(); 
    let needConfirm = false;
    let msgKey = '';

    // 情境1：手機嘗試切換到鍵鼠模式
    if (isTouchDev && targetMode === 'mouse') {
        needConfirm = true;
        msgKey = state.lang === 'en' ? 'confirm_mouse_on_touch_en' : 'confirm_mouse_on_touch';
    }

    // 情境2：電腦嘗試切換到觸控模式
    else if (!isTouchDev && targetMode === 'touch') {
        needConfirm = true;
        msgKey = state.lang === 'en' ? 'confirm_touch_on_mouse_en' : 'confirm_touch_on_mouse';
    }

    if (needConfirm) {
        pendingMode = targetMode;
        showConfirmModal(msgKey);
    } else {
        setMode(targetMode);
    }
}

function showConfirmModal(msgKey) {
    const modal = document.getElementById('confirmModal');
    const msgEl = document.getElementById('confirm-msg');
    
    // 設定文字
    msgEl.textContent = zhToEn[msgKey] || msgKey; 
    
    modal.style.display = 'block';
}

// 確認視窗按鈕綁定
const confirmModal = document.getElementById('confirmModal');
const confirmOkBtn = document.getElementById('confirm-ok-btn');
const confirmCancelBtn = document.getElementById('confirm-cancel-btn');

confirmOkBtn.onclick = () => {
    if (pendingMode) setMode(pendingMode);
    confirmModal.style.display = 'none';
    pendingMode = null;
};
confirmCancelBtn.onclick = () => {
    confirmModal.style.display = 'none';
    pendingMode = null;
};

// 點擊遮罩關閉
confirmModal.onclick = (e) => {
    if (e.target === confirmModal) {
        confirmModal.style.display = 'none';
        pendingMode = null;
    }
};


/* =========================================
   UI 事件綁定 (Modal & Drawer)
   ========================================= */

// 1. Settings Modal
const settingModal = document.getElementById('settingModal');
document.getElementById('settings-trigger').onclick = () => {
    settingModal.style.display = 'block';
};
settingModal.onclick = (e) => {
    if (e.target === settingModal) settingModal.style.display = 'none';
};

// 2. Help Modal
const helpModal = document.getElementById('helpModal');
helpModal.onclick = (e) => {
    if (e.target === helpModal) helpModal.style.display = 'none';
};

// 3. Mobile Drawer (包含左滑關閉與方向鎖定邏輯)
const drawer = document.getElementById('drawer');
const mobileMenuBtn = document.getElementById('mobile-menu-trigger');

if (mobileMenuBtn && drawer) {
    mobileMenuBtn.addEventListener('click', () => {
        drawer.classList.add('open');
    });

    // --- 左滑關閉邏輯 (包含方向鎖定與無縫動畫) ---
    let drawerStartX = 0;
    let drawerStartY = 0;
    let isDrawerDragging = false; 

    drawer.addEventListener('touchstart', (e) => {
        if (!drawer.classList.contains('open')) return;
        
        drawerStartX = e.touches[0].clientX;
        drawerStartY = e.touches[0].clientY;
        isDrawerDragging = false;
        
        // 拖曳時暫時移除 transition 以求即時跟手
        drawer.style.transition = 'none';
    }, {passive: false}); // passive: false 才能使用 preventDefault

    drawer.addEventListener('touchmove', (e) => {
        if (!drawer.classList.contains('open')) return;
        
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const diffX = currentX - drawerStartX;
        const diffY = currentY - drawerStartY;

        // 判斷拖曳意圖 (僅在第一次移動時判斷)
        if (!isDrawerDragging) {
            // 如果垂直移動距離 > 水平移動距離，視為上下捲動瀏覽內容
            if (Math.abs(diffY) > Math.abs(diffX)) {
                return; // 放棄這次的抽屜拖曳，允許原生捲動
            }
            // 如果水平移動明顯，則鎖定為抽屜拖曳
            if (Math.abs(diffX) > 5) {
                isDrawerDragging = true;
            }
        }

        if (isDrawerDragging) {
            // 只有向左滑 (diffX < 0) 或微量向右彈性時才執行
            if (diffX < 0) {
                e.preventDefault(); // 禁止瀏覽器預設捲動行為 (防止畫面上下跑)
                drawer.style.transform = `translateX(${diffX}px)`;
            }
        }
    }, {passive: false});

    drawer.addEventListener('touchend', (e) => {
        if (!drawer.classList.contains('open')) return;
        
        // 恢復動畫過渡效果
        drawer.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        
        const currentX = e.changedTouches[0].clientX;
        const diffX = currentX - drawerStartX;
        const drawerWidth = drawer.offsetWidth;

        // 閾值判斷：向左滑動超過 25% (剩餘寬度 < 75%)
        if (diffX < 0 && Math.abs(diffX) > (drawerWidth * 0.25)) {
            // == 關閉邏輯 ==
            // 1. 先用 inline style 讓它滑到 -100% (視覺上關閉)
            drawer.style.transform = 'translateX(-100%)';
            
            // 2. 等待動畫結束後，才真正移除 class 並清理 style
            setTimeout(() => {
                drawer.classList.remove('open');
                drawer.style.transform = ''; 
            }, 300);
        } else {
            // == 回彈邏輯 ==
            drawer.style.transform = 'translateX(0)';
            // 等待回彈動畫結束後清理 style，讓 CSS class 接手
            setTimeout(() => {
                drawer.style.transform = ''; 
            }, 300);
        }
        
        isDrawerDragging = false;
    });
}

document.addEventListener('click', (e) => {
    if (drawer && drawer.classList.contains('open')) {
        if (!drawer.contains(e.target) && e.target !== mobileMenuBtn) {
            drawer.classList.remove('open');
            drawer.style.transform = '';
        }
    }
});


document.getElementById('lang-zh').onclick = () => setLang('zh');
document.getElementById('lang-en').onclick = () => setLang('en');

// [修改] 模式切換改為呼叫帶有確認彈窗邏輯的函數
document.getElementById('mode-mouse').onclick = () => handleModeChangeAttempt('mouse');
document.getElementById('mode-touch').onclick = () => handleModeChangeAttempt('touch');

document.getElementById('clearBtn').onclick = () => {
    state.icons[state.terrain] = Array(12).fill(null);
    renderMapIcons();
    runFilter();
};
document.getElementById('resetBtn').onclick = () => {
    location.reload();
};

window.onload = () => {
    initGlowEffect();
    renderBossList();
    initWheel();
    renderMapIcons();
    setLang(state.lang);
    setMode(state.mode); 
    initTouchDrag(); 
    
    initWelcome(); 
    initHelp();    
    
    document.oncontextmenu = (e) => e.preventDefault();
};
